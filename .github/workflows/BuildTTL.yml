name: Build TTLink slim reF1nd stable patched eBPF

on:
  push:
    branches:
      - ci/ref1nd-rc1-slim-20260824
    paths-ignore:
      - '.ci/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Publish run id immediately
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'TTLink CI'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin "$GITHUB_REF_NAME"
          mkdir -p .ci
          printf '%s\n' "$GITHUB_RUN_ID" > .ci/run-id.txt
          printf '%s\n' "$GITHUB_SHA" > .ci/trigger-sha.txt
          git add .ci/run-id.txt .ci/trigger-sha.txt
          git commit -m 'ci: record patched eBPF build run [skip ci]' || true
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Checkout exact reF1nd source
        uses: actions/checkout@v4
        with:
          repository: reF1nd/sing-box
          ref: 6754cc79bc477a5411af8c7d8e7fa97d441c4986
          fetch-depth: 1
          path: sing-box

      - name: Checkout stable sing-ebpf dependency
        uses: actions/checkout@v4
        with:
          repository: CHIZI-0618/sing-ebpf
          ref: c52c21d4066a6e9e92fef2cf13bbf681357f2d78
          fetch-depth: 1
          path: sing-ebpf-patched

      - name: Backport Android socket-release optional fallback only
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("sing-ebpf-patched/internal/core/cgroup_maps.go")
          s = p.read_text()
          old = '''func probeSocketReleaseSupport(cgroupFD int) (bool, error) {
          	program, err := CiliumEBPF.NewProgram(&CiliumEBPF.ProgramSpec{
          		Name:       "sb_rel_probe",
          		Type:       CiliumEBPF.CGroupSock,
          		AttachType: CiliumEBPF.AttachCgroupInetSockRelease,
          		License:    "GPL",
          		Instructions: asm.Instructions{
          			asm.Mov.Imm(asm.R0, 1),
          			asm.Return(),
          		},
          	})
          	if err != nil {
          		if socketReleaseUnavailable(err) {
          			return false, nil
          		}
          		return false, err
          	}
          	if err = attachProgramRaw(cgroupFD, program, CiliumEBPF.AttachCgroupInetSockRelease); err != nil {
          		closeErr := program.Close()
          		if socketReleaseUnavailable(err) {
          			return false, closeErr
          		}
          		return false, E.Errors(err, closeErr)
          	}
          	detachErr := rawDetachProgram(cgroupFD, program, CiliumEBPF.AttachCgroupInetSockRelease)
          	closeErr := program.Close()
          	if detachErr != nil {
          		return false, E.Errors(detachErr, closeErr)
          	}
          	if closeErr != nil {
          		return false, closeErr
          	}
          	return true, nil
          }

          func socketReleaseUnavailable(err error) bool {
          	return errors.Is(err, unix.EINVAL) || errors.Is(err, unix.ENOTSUP) ||
          		errors.Is(err, unix.EOPNOTSUPP) || errors.Is(err, linuxErrnoNotSupported)
          }
          '''
          new = '''func probeSocketReleaseSupport(cgroupFD int) (bool, error) {
          	program, err := CiliumEBPF.NewProgram(&CiliumEBPF.ProgramSpec{
          		Name:       "sb_rel_probe",
          		Type:       CiliumEBPF.CGroupSock,
          		AttachType: CiliumEBPF.AttachCgroupInetSockRelease,
          		License:    "GPL",
          		Instructions: asm.Instructions{
          			asm.Mov.Imm(asm.R0, 1),
          			asm.Return(),
          		},
          	})
          	if err != nil {
          		// Socket-release is only an optional UDP cleanup optimization.
          		// Android/vendor kernels may deny this hook while the required
          		// cgroup connect/sendmsg data plane remains fully usable.
          		if socketReleaseProbeUnavailable(err) {
          			return false, nil
          		}
          		return false, err
          	}
          	if err = attachProgramRaw(cgroupFD, program, CiliumEBPF.AttachCgroupInetSockRelease); err != nil {
          		closeErr := program.Close()
          		if socketReleaseProbeUnavailable(err) {
          			return false, closeErr
          		}
          		return false, E.Errors(err, closeErr)
          	}
          	detachErr := rawDetachProgram(cgroupFD, program, CiliumEBPF.AttachCgroupInetSockRelease)
          	closeErr := program.Close()
          	if detachErr != nil {
          		return false, E.Errors(detachErr, closeErr)
          	}
          	if closeErr != nil {
          		return false, closeErr
          	}
          	return true, nil
          }

          func socketReleaseProbeUnavailable(err error) bool {
          	return socketReleaseUnavailable(err) || errors.Is(err, unix.EPERM) || errors.Is(err, unix.EACCES)
          }

          func socketReleaseUnavailable(err error) bool {
          	return errors.Is(err, unix.EINVAL) || errors.Is(err, unix.ENOTSUP) ||
          		errors.Is(err, unix.EOPNOTSUPP) || errors.Is(err, linuxErrnoNotSupported)
          }
          '''
          if old not in s:
              raise SystemExit("expected stable probe block not found")
          p.write_text(s.replace(old, new))
          PY

          cat > sing-ebpf-patched/internal/core/ttlink_socket_release_patch_test.go <<'EOF'
          //go:build with_ebpf && (linux || android)

          package core

          import (
              "testing"
              "golang.org/x/sys/unix"
          )

          func TestTTLinkSocketReleasePermissionFallsBack(t *testing.T) {
              for _, err := range []error{unix.EPERM, unix.EACCES, unix.EINVAL, unix.ENOTSUP, unix.EOPNOTSUPP} {
                  if !socketReleaseProbeUnavailable(err) {
                      t.Fatalf("%v should select optional socket-release fallback", err)
                  }
              }
              if socketReleaseProbeUnavailable(unix.EBADF) {
                  t.Fatal("unrelated error must remain fatal")
              }
          }
          EOF

          # Guard against accidentally backporting the risky exclusive attach fallback.
          if grep -q 'options.Flags = 0' sing-ebpf-patched/internal/core/loader.go; then
            echo 'unexpected exclusive cgroup attach fallback present' >&2
            exit 1
          fi

      - name: Set up Go 1.25.5
        uses: actions/setup-go@v6
        with:
          go-version: 1.25.5
          cache: false

      - name: Verify patched sing-ebpf unit
        shell: bash
        run: |
          set -euxo pipefail
          cd sing-ebpf-patched
          go test -tags with_ebpf ./internal/core -run TestTTLinkSocketReleasePermissionFallsBack -count=1

      - name: Build TTLink slim Android arm64 and Linux amd64 cores
        shell: bash
        run: |
          set -euxo pipefail
          cd sing-box
          git tag -f v1.14.1-reF1nd 6754cc79bc477a5411af8c7d8e7fa97d441c4986
          go mod edit -replace github.com/CHIZI-0618/sing-ebpf=../sing-ebpf-patched
          mkdir -p ../artifact
          TAGS_SLIM='with_quic,with_utls,with_clash_api,with_gvisor,with_ebpf,badlinkname,tfogo_checklinkname0'

          export CGO_ENABLED=0 GOOS=android GOARCH=arm64
          TAGS="$TAGS_SLIM" make build
          mv sing-box ../artifact/sing-box-ttlink-android-arm64

          export CGO_ENABLED=0 GOOS=linux GOARCH=amd64
          TAGS="$TAGS_SLIM" make build
          mv sing-box ../artifact/sing-box-ttlink-linux-amd64

          cd ../artifact
          chmod 0755 sing-box-ttlink-*
          file sing-box-ttlink-* | tee file.txt
          go version -m sing-box-ttlink-android-arm64 | tee go-version-android.txt
          go version -m sing-box-ttlink-linux-amd64 | tee go-version-linux.txt
          sha256sum sing-box-ttlink-* | tee sha256.txt
          stat -c '%n %s bytes' sing-box-ttlink-* | tee sizes.txt
          grep -q 'with_ebpf' go-version-android.txt
          grep -q 'with_quic' go-version-android.txt
          grep -q 'with_utls' go-version-android.txt
          grep -q 'with_clash_api' go-version-android.txt
          grep -q 'with_gvisor' go-version-android.txt
          grep -q '=> ../sing-ebpf-patched' go-version-android.txt

          cat > ttlink-patch.txt <<'EOF'
          Base sing-box: reF1nd/sing-box v1.14.1-reF1nd
          Base sing-ebpf: c52c21d4066a6e9e92fef2cf13bbf681357f2d78
          TTLink backport: BPF_CGROUP_INET_SOCK_RELEASE EPERM/EACCES is optional and falls back to LRU cleanup.
          Safety: no flags=0 exclusive cgroup attach fallback is included.
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ttlink-ref1nd-1.14.1-socket-release-safe
          path: artifact/
          compression-level: 9
          retention-days: 1

      - name: Publish build metadata
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'TTLink CI'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin "$GITHUB_REF_NAME"
          mkdir -p .ci
          cp artifact/go-version-android.txt artifact/go-version-linux.txt artifact/sha256.txt artifact/sizes.txt artifact/file.txt artifact/ttlink-patch.txt .ci/
          git add .ci/
          git commit -m 'ci: publish socket-release-safe metadata [skip ci]' || true
          git push origin "HEAD:$GITHUB_REF_NAME"
