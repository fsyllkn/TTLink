name: Build TTLink slim reF1nd RC1

on:
  push:
    branches:
      - ci/ref1nd-rc1-slim-20260824
    paths-ignore:
      - '.ci/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Record workflow run id
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .ci
          printf '%s\n' "$GITHUB_RUN_ID" > .ci/ref1nd-run-id.txt
          printf '%s\n' "$GITHUB_SHA" > .ci/ref1nd-trigger-sha.txt
          git config user.name 'TTLink CI'
          git config user.email 'actions@users.noreply.github.com'
          git add .ci/ref1nd-run-id.txt .ci/ref1nd-trigger-sha.txt
          git commit -m 'ci: record reF1nd build run [skip ci]' || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Checkout exact reF1nd source
        uses: actions/checkout@v4
        with:
          repository: reF1nd/sing-box
          ref: 1eeea68a0bbcfa1a92af06149f95f41d73b3db49
          fetch-depth: 1
          path: sing-box

      - name: Set up Go 1.26.6
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.6
          cache: false

      - name: Build TTLink slim Android arm64 cores
        shell: bash
        run: |
          set -euxo pipefail
          cd sing-box
          git tag -f v1.14.0-rc.1-reF1nd 1eeea68a0bbcfa1a92af06149f95f41d73b3db49
          mkdir -p ../artifact

          export CGO_ENABLED=0
          export GOOS=android
          export GOARCH=arm64

          TAGS_SLIM='with_quic,with_utls,with_clash_api,with_gvisor,with_ebpf,badlinkname,tfogo_checklinkname0'
          TAGS="$TAGS_SLIM" make build
          mv sing-box ../artifact/sing-box-ttlink-slim

          TAGS_COMPAT="${TAGS_SLIM},with_tailscale,with_connection_history"
          TAGS="$TAGS_COMPAT" make build
          mv sing-box ../artifact/sing-box-ttlink-compat

          cd ../artifact
          chmod 0755 sing-box-ttlink-*
          file sing-box-ttlink-* | tee file.txt
          go version -m sing-box-ttlink-slim | tee go-version-slim.txt
          go version -m sing-box-ttlink-compat | tee go-version-compat.txt
          sha256sum sing-box-ttlink-* | tee sha256.txt
          stat -c '%n %s bytes' sing-box-ttlink-* | tee sizes.txt
          grep -q 'with_ebpf' go-version-slim.txt
          grep -q 'with_quic' go-version-slim.txt
          grep -q 'with_utls' go-version-slim.txt
          grep -q 'with_clash_api' go-version-slim.txt
          grep -q 'with_gvisor' go-version-slim.txt

      - name: Upload slim cores
        uses: actions/upload-artifact@v4
        with:
          name: ttlink-ref1nd-rc1-slim-arm64
          path: artifact/
          compression-level: 9
          retention-days: 1
